<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATEMATYKA+ | Tablica LIVE i Strefa Ucznia</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<style>
:root{--bg:#0f0f12;--panel:#18181c;--panel2:#212127;--gold:#d6b56d;--gold2:#f0d99e;--muted:#9e9b95;--line:#2e2d33;--white:#f7f5ef;--green:#3fb950;--red:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font:14px/1.4 Inter,system-ui,-apple-system,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}

.view{display:none}.view.active{display:block}

/* DASHBOARD / FOLDERY */
.dashboard{max-width:1100px;margin:30px auto;padding:20px}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;border-bottom:1px solid var(--line);padding-bottom:20px;flex-wrap:wrap;gap:12px}
.brand{font-size:22px;font-weight:800;letter-spacing:1px}.brand span{color:var(--gold)}

.folder-section{margin-bottom:35px}
.folder-title{font-size:18px;color:var(--gold2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.boards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px}
.board-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.board-card:hover{border-color:#554c38;transform:translateY(-2px)}
.board-card h4{margin:0;font-size:16px;color:var(--white)}
.board-card .date{font-size:12px;color:var(--muted)}
.card-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

.goldbtn{background:var(--gold);color:#17130b;border:0;border-radius:8px;padding:8px 16px;font-weight:700}
.goldbtn:hover{background:var(--gold2)}
.tool{background:#242429;border:1px solid #3a3940;color:#eee;padding:7px 12px;border-radius:8px;font-size:13px}
.tool:hover:not(:disabled){background:#2f2f36;border-color:#5b5963}
.tool.active{border-color:var(--gold);color:var(--gold2);background:#302719}
.tool:disabled{opacity:.35;cursor:not-allowed}

/* MODAL TWORZENIA TABLICY */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.open{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:24px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.modal-box h3{margin:0;color:var(--gold2);font-size:18px}
.modal-box label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.modal-box input,.modal-box select{width:100%;background:#101014;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--white);outline:none}
.modal-box input:focus,.modal-box select:focus{border-color:var(--gold)}

/* POWIADOMIENIE TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:#211d15;border:1px solid var(--gold);color:var(--gold2);padding:12px 18px;border-radius:10px;font-weight:600;z-index:100;box-shadow:0 8px 25px rgba(0,0,0,.6);display:none}

/* EDYTOR TABLICY */
.board-shell{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:54px;background:#131317;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.status-pill{display:flex;align-items:center;gap:6px;background:#1c1c21;border:1px solid var(--line);padding:4px 10px;border-radius:20px;font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.waiting{background:var(--gold);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.toolbar{height:46px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 16px;overflow-x:auto}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.lbl{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}
input,select{background:#101014;border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--white);outline:none}

.workspace{display:grid;grid-template-columns:1fr 185px;flex:1;overflow:hidden}
.canvas-area{padding:10px;background:#0d0d10;display:flex;align-items:stretch;justify-content:center;overflow:hidden}
.paper{background:#fff;width:100%;height:100%;border-radius:6px;position:relative;box-shadow:0 6px 24px rgba(0,0,0,.5);overflow:hidden;transition:outline .15s}
.paper.drag-over{outline:4px dashed var(--gold);outline-offset:-6px}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

/* PŁYWAJĄCY PANEL WZORÓW I PISANIA W LINII */
.floating-math-toolbar{
  position:absolute;top:15px;left:50%;transform:translateX(-50%);z-index:25;
  background:#1a1a20;border:1px solid var(--gold);border-radius:10px;padding:6px 12px;
  display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(0,0,0,0.5);flex-wrap:wrap;max-width:92%;
}
.f-btn{background:#26262d;border:1px solid #3d3c45;color:var(--gold2);padding:4px 8px;border-radius:6px;font-size:13px;font-weight:600}
.f-btn:hover{background:#33333d}

.inline-text-editor{
  position:absolute;z-index:20;background:rgba(255,255,255,0.96);border:2px dashed var(--gold);
  border-radius:6px;padding:8px 12px;min-width:220px;box-shadow:0 4px 15px rgba(0,0,0,0.2);
  color:#111;outline:none;font-family:Inter,sans-serif;font-size:16px;
}
.inline-text-editor:focus{border-style:solid}

.board-math-item{position:absolute;z-index:5;padding:4px 8px;border-radius:4px;pointer-events:none;background:rgba(255,255,255,0.92);box-shadow:0 2px 8px rgba(0,0,0,0.1);color:#111}

.remote-cursor{position:absolute;pointer-events:none;z-index:15;transform:translate(-2px,-2px);transition:left .04s linear,top .04s linear;display:none}
.remote-cursor svg{width:16px;height:16px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.remote-label{background:var(--gold);color:#14110a;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;margin-left:8px;margin-top:-3px}

.sidebar{background:#151519;border-left:1px solid var(--line);padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.sidebar h3{margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:.8px}
.page-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:calc(100vh - 240px)}
.page-thumb{background:#202026;border:1px solid var(--line);color:#ddd;padding:8px;border-radius:8px;text-align:left;font-size:12px}
.page-thumb.active{border-color:var(--gold);color:var(--gold2);background:#292318}
.page-thumb small{display:block;color:var(--muted);font-size:10px}
</style>
</head>
<body>

<!-- PANEL / FOLDERY -->
<div id="dashboardView" class="view active">
  <div class="dashboard">
    <div class="dash-header">
      <div class="brand" id="dashBrandTitle">MATEMATYKA<span>+</span> | Panel Nauczyciela</div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <h2 id="dashTitle" style="margin:0;color:var(--gold2)">Zarządzanie tablicami</h2>
        <p style="margin:4px 0 0;color:var(--muted)" id="dashSubtitle">Twórz tablice w folderach i udostępniaj je uczniom.</p>
      </div>
      <button class="goldbtn" id="newBoardMainBtn" onclick="openCreateModal()">＋ Utwórz nową tablicę</button>
    </div>

    <div id="foldersContainer"></div>
  </div>
</div>

<!-- OKNO TWORZENIA NOWEJ TABLICY -->
<div class="modal-backdrop" id="createModal">
  <div class="modal-box">
    <h3>Nowa tablica lekcyjna</h3>
    <div>
      <label>Temat / nazwa tablicy</label>
      <input id="newBoardTitle" placeholder="np. Funkcja kwadratowa - zadania maturalne">
    </div>
    <div>
      <label>Wybierz folder</label>
      <select id="newBoardFolder">
        <option value="podstawa">📁 Matematyka Podstawowa</option>
        <option value="rozszerzenie">📁 Matematyka Rozszerzona</option>
        <option value="domowe">📁 Zadania Domowe i Powtórki</option>
      </select>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px">
      <button class="tool" onclick="closeCreateModal()">Anuluj</button>
      <button class="goldbtn" onclick="confirmCreateBoard()">Utwórz i otwórz →</button>
    </div>
  </div>
</div>

<!-- WIDOK TABLICY LIVE -->
<div id="boardView" class="view">
  <div class="board-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="tool" onclick="goHome()">← Powrót do folderów</button>
        <div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="currentBoardTitleHeader">Tablica</div>
        <span style="font-size:12px;color:var(--gold2);background:#262015;padding:3px 8px;border-radius:6px;white-space:nowrap" id="currentBoardFolderBadge">📁 Folder</span>
        <div class="status-pill">
          <span class="dot" id="liveDot"></span>
          <span id="liveText">Łączenie...</span>
        </div>
      </div>
      <div style="display:flex;gap:8px" id="boardTopActions">
        <button class="goldbtn" id="copyBoardLinkBtn" style="padding:6px 12px;font-size:13px">📤 Udostępnij uczniowi (Kopiuj link)</button>
      </div>
    </header>

    <div class="toolbar">
      <button class="tool active" id="penBtn">✎ Pisak</button>
      <button class="tool" id="laserBtn">◎ Laser</button>
      <button class="tool" id="eraserBtn">⌫ Gumka</button>
      <button class="tool" id="lineBtn">╱ Linia</button>
      <button class="tool" id="rectBtn">▢ Prostokąt</button>
      <button class="tool" id="ellipseBtn">◯ Okrąg</button>
      <button class="tool" id="textBtn">T Pisanie (Word)</button>
      <span class="sep"></span>
      <label class="lbl">Kolor <input id="ink" type="color" value="#171717" style="width:30px;height:26px;padding:1px"></label>
      <label class="lbl">Grubość <input id="width" type="range" min="1" max="16" value="3" style="width:65px"></label>
      <label class="lbl">Kartka
        <select id="paperType" style="padding:4px 6px">
          <option value="grid" selected>W kratkę</option>
          <option value="plain">Czysta</option>
          <option value="lined">W linie</option>
        </select>
      </label>
      <span class="sep"></span>
      <button class="tool" id="undoBtn">↶ Cofnij</button>
      <button class="tool" id="redoBtn">↷ Ponów</button>
      <button class="tool" id="clearBtn">Wyczyść</button>
      <span class="sep"></span>
      <button class="tool" id="imageBtn" title="Wybierz plik z dysku">＋ Zdjęcie</button>
      <button class="tool" id="pasteBtn" title="Wklej zrzut ekranu ze schowka (Ctrl+V)">📋 Wklej screen</button>
      <input id="imageInput" type="file" accept="image/*" hidden>
      <button class="tool" id="downloadBtn">↓ Zapisz PNG</button>
    </div>

    <div class="workspace">
      <div class="canvas-area">
        <div class="paper" id="paperBox">
          <canvas id="whiteboard"></canvas>

          <div class="floating-math-toolbar" id="floatingMathToolbar" style="display:none">
            <span style="font-size:11px;color:var(--muted)">Wzory:</span>
            <button class="f-btn" type="button" onclick="insertSnippet('\\frac{a}{b}')">a/b</button>
            <button class="f-btn" type="button" onclick="insertSnippet('x^2')">x²</button>
            <button class="f-btn" type="button" onclick="insertSnippet('\\sqrt{x}')">√x</button>
            <button class="f-btn" type="button" onclick="insertSnippet('\\alpha')">α</button>
            <button class="f-btn" type="button" onclick="insertSnippet('\\pi')">π</button>
            <button class="f-btn" type="button" onclick="insertSnippet('\\int')">∫</button>
            <button class="f-btn" type="button" onclick="insertSnippet('\\infty')">∞</button>
            <span style="color:var(--line)">|</span>
            <button class="goldbtn" style="padding:3px 8px;font-size:12px" onclick="commitInlineText()">✓ Zapisz (Ctrl+Enter)</button>
          </div>

          <div class="remote-cursor" id="remoteCursor">
            <svg viewBox="0 0 24 24" fill="#d6b56d" stroke="#111" stroke-width="1.5"><path d="M4 2l16 10-7 2-3 7z"/></svg>
            <div class="remote-label" id="remoteCursorLabel">Uczestnik</div>
          </div>
        </div>
      </div>

      <aside class="sidebar">
        <div>
          <h3>STRONY</h3>
          <div class="page-list" id="pageList"></div>
          <button class="goldbtn" id="addPage" style="width:100%;margin-top:8px;padding:7px">＋ Nowa strona</button>
          <button class="tool" id="duplicatePage" style="width:100%;margin-top:5px">Kopiuj</button>
          <button class="tool" id="deletePage" style="width:100%;margin-top:5px">Usuń</button>
        </div>
        <div style="font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px">
          Możesz też przeciągnąć i upuścić zrzut ekranu prosto na kartkę.
        </div>
      </aside>
    </div>
  </div>
</div>

<div class="toast" id="toastMsg"></div>

<script>
const DEFAULT_FOLDERS = [
  { id: 'podstawa', name: 'Matematyka Podstawowa' },
  { id: 'rozszerzenie', name: 'Matematyka Rozszerzona' },
  { id: 'domowe', name: 'Zadania Domowe i Powtórki' }
];

let isStudentMode = false;

function getFolderName(folderId){
  const f = DEFAULT_FOLDERS.find(x => x.id === folderId);
  return f ? f.name : 'Matematyka Podstawowa';
}

function showToast(text){
  const el = document.getElementById('toastMsg');
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

function getStoredBoards(){
  try {
    const data = localStorage.getItem('matplus_boards_v2');
    return data ? JSON.parse(data) : [
      { id: 'demo-1', title: 'Powtórzenie do matury - Funkcja kwadratowa', folder: 'podstawa', date: '2026-11-13', pages: [{id:'p1', type:'grid', items:[]}], currentPage: 0 }
    ];
  } catch(e) { return []; }
}

function saveStoredBoards(boards){
  try {
    localStorage.setItem('matplus_boards_v2', JSON.stringify(boards));
  } catch(e) {
    showToast('⚠ Brak miejsca w pamięci przeglądarki.');
  }
}

function buildShareUrl(board){
  const url = new URL(window.location.origin + window.location.pathname);
  url.searchParams.set('board', board.id);
  url.searchParams.set('title', board.title);
  url.searchParams.set('folder', board.folder);
  url.searchParams.set('role', 'student');
  return url.toString();
}

function copyShareLinkForBoard(boardId){
  const boards = getStoredBoards();
  const b = boards.find(x => x.id === boardId);
  if(!b) return;
  const link = buildShareUrl(b);
  navigator.clipboard.writeText(link).then(() => {
    showToast('✓ Skopiowano link dla ucznia!');
  });
}

function applyRoleUI(){
  if(isStudentMode){
    document.getElementById('dashBrandTitle').innerHTML = 'MATEMATYKA<span>+</span> | Strefa Ucznia';
    document.getElementById('dashTitle').textContent = 'Twoje materiały i tablice z lekcji';
    document.getElementById('dashSubtitle').textContent = 'Przeglądaj wszystkie udostępnione przez nauczyciela tablice.';
    document.getElementById('newBoardMainBtn').style.display = 'none';
  } else {
    document.getElementById('dashBrandTitle').innerHTML = 'MATEMATYKA<span>+</span> | Panel Nauczyciela';
    document.getElementById('dashTitle').textContent = 'Zarządzanie tablicami';
    document.getElementById('dashSubtitle').textContent = 'Twórz tablice w folderach i udostępniaj je uczniom.';
    document.getElementById('newBoardMainBtn').style.display = 'inline-block';
  }
  renderDashboard();
}

function renderDashboard(){
  const container = document.getElementById('foldersContainer');
  container.innerHTML = '';
  const boards = getStoredBoards();

  DEFAULT_FOLDERS.forEach(folder => {
    const folderBoards = boards.filter(b => b.folder === folder.id);
    const section = document.createElement('div');
    section.className = 'folder-section';
    section.innerHTML = `
      <div class="folder-title">📁 ${folder.name} (${folderBoards.length})</div>
      <div class="boards-grid">
        ${folderBoards.length === 0 ? '<div style="color:var(--muted);font-size:13px;padding:10px">Brak tablic w tym folderze.</div>' : ''}
        ${folderBoards.map(b => `
          <div class="board-card">
            <h4>${b.title}</h4>
            <div class="date">Data: ${b.date} • Stron: ${(b.pages || []).length}</div>
            <div class="card-actions">
              <button class="goldbtn" style="padding:6px 12px;font-size:12px;flex:1" onclick="openBoard('${b.id}')">Otwórz tablicę</button>
              ${!isStudentMode ? `<button class="tool" style="padding:6px 10px;font-size:12px" onclick="copyShareLinkForBoard('${b.id}')" title="Skopiuj link dla ucznia">📤 Udostępnij</button>` : ''}
              ${!isStudentMode ? `<button class="tool" style="padding:6px 10px;font-size:12px;color:var(--red)" onclick="deleteBoard('${b.id}')">✕</button>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(section);
  });
}

function openCreateModal(){
  if(isStudentMode) return;
  document.getElementById('newBoardTitle').value = '';
  document.getElementById('createModal').classList.add('open');
  document.getElementById('newBoardTitle').focus();
}

function closeCreateModal(){
  document.getElementById('createModal').classList.remove('open');
}

function confirmCreateBoard(){
  const rawTitle = document.getElementById('newBoardTitle').value.trim();
  const title = rawTitle || ('Lekcja ' + new Date().toLocaleDateString('pl-PL'));
  const folder = document.getElementById('newBoardFolder').value;

  const newId = 'board-' + Math.random().toString(36).substring(2, 10);
  const boards = getStoredBoards();
  const newBoard = {
    id: newId,
    title: title,
    folder: folder,
    date: new Date().toISOString().split('T')[0],
    pages: [{id: 'p1', type: 'grid', items: []}],
    currentPage: 0
  };
  boards.push(newBoard);
  saveStoredBoards(boards);
  closeCreateModal();
  openBoard(newId);
}

function deleteBoard(id){
  if(isStudentMode) return;
  if(confirm('Usunąć tę tablicę?')){
    saveStoredBoards(getStoredBoards().filter(b => b.id !== id));
    renderDashboard();
  }
}

function goHome(){
  if(peer) peer.destroy();
  if(isStudentMode){
    const url = new URL(window.location.origin + window.location.pathname);
    url.searchParams.set('role', 'student');
    window.history.replaceState({}, '', url);
  } else {
    window.history.replaceState({}, '', window.location.pathname);
  }
  document.getElementById('boardView').classList.remove('active');
  document.getElementById('dashboardView').classList.add('active');
  applyRoleUI();
}

/* TABLICA I PISANIE */
let activeBoardId = null, pages = [], page = 0, tool = 'pen', drawing = false, current = null, remoteActiveItem = null, laserPoints = [], redoStack = [];
let activeInlineEditor = null;

function openBoard(id, metaFromUrl = null){
  activeBoardId = id;
  let boards = getStoredBoards();
  let bData = boards.find(b => b.id === id);

  if(!bData){
    bData = {
      id: id,
      title: metaFromUrl?.title || 'Tablica lekcyjna',
      folder: DEFAULT_FOLDERS.some(f => f.id === metaFromUrl?.folder) ? metaFromUrl.folder : 'podstawa',
      date: new Date().toISOString().split('T')[0],
      pages: [{id: 'p1', type: 'grid', items: []}],
      currentPage: 0
    };
    boards.push(bData);
    saveStoredBoards(boards);
    showToast('📁 Zapisano tablicę w Strefie Ucznia (' + getFolderName(bData.folder) + ')');
  } else if(metaFromUrl?.title){
    bData.title = metaFromUrl.title;
    if(DEFAULT_FOLDERS.some(f => f.id === metaFromUrl.folder)) bData.folder = metaFromUrl.folder;
    saveStoredBoards(boards);
  }

  document.getElementById('currentBoardTitleHeader').textContent = bData.title;
  document.getElementById('currentBoardFolderBadge').textContent = '📁 ' + getFolderName(bData.folder);
  document.getElementById('copyBoardLinkBtn').style.display = isStudentMode ? 'none' : 'inline-block';

  pages = bData.pages || [{id: 'p1', type: 'grid', items: []}];
  page = bData.currentPage || 0;

  document.getElementById('dashboardView').classList.remove('active');
  document.getElementById('boardView').classList.add('active');

  const currentUrl = new URL(window.location.href);
  currentUrl.searchParams.set('board', id);
  if(isStudentMode) currentUrl.searchParams.set('role', 'student');
  window.history.replaceState({}, '', currentUrl.toString());

  setTimeout(() => { resizeCanvas(); renderPages(); render(); initLivePeer(id); }, 50);
}

function saveCurrentBoardData(){
  if(!activeBoardId) return;
  const boards = getStoredBoards();
  const idx = boards.findIndex(b => b.id === activeBoardId);
  if(idx !== -1){
    boards[idx].pages = pages;
    boards[idx].currentPage = page;
    saveStoredBoards(boards);
  }
}

document.getElementById('copyBoardLinkBtn').onclick = () => {
  if(activeBoardId && !isStudentMode) copyShareLinkForBoard(activeBoardId);
};

const canvas = document.getElementById('whiteboard');
const ctx = canvas.getContext('2d');
const paper = document.getElementById('paperBox');
const imageCache = new Map();

function uid(){ return Math.random().toString(36).slice(2, 10); }
const dpr = () => window.devicePixelRatio || 1;
function dimensions(){ return {w: Math.max(300, paper.clientWidth), h: Math.max(300, paper.clientHeight)}; }

function resizeCanvas(){
  const {w, h} = dimensions();
  canvas.width = w * dpr(); canvas.height = h * dpr();
  ctx.setTransform(dpr(), 0, 0, dpr(), 0, 0); render();
}

function drawPaper(type){
  const {w, h} = dimensions();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
  ctx.save(); ctx.strokeStyle = '#e5e8ed'; ctx.lineWidth = 1;
  if(type === 'grid'){
    for(let x = 24; x < w; x += 24){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for(let y = 24; y < h; y += 24){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  } else if(type === 'lined'){
    for(let y = 32; y < h; y += 30){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  }
  ctx.restore();
}

function render(){
  const {w, h} = dimensions();
  ctx.clearRect(0, 0, w, h);
  if(!pages[page]) page = 0;
  drawPaper(pages[page].type);
  
  document.querySelectorAll('.board-math-item').forEach(el => el.remove());
  pages[page].items.forEach(item => {
    if(item.kind === 'math') renderMathItemOnPaper(item);
    else drawItem(item);
  });

  if(current) drawItem(current);
  if(remoteActiveItem && remoteActiveItem.kind !== 'math') drawItem(remoteActiveItem);
  drawLaser();
  document.getElementById('undoBtn').disabled = !pages[page].items.length;
  document.getElementById('redoBtn').disabled = !redoStack.length;
  saveCurrentBoardData();
}

function renderMathItemOnPaper(item){
  const {w, h} = dimensions();
  const div = document.createElement('div');
  div.className = 'board-math-item';
  div.style.left = (item.nx * w) + 'px';
  div.style.top = (item.ny * h) + 'px';
  div.style.color = item.color || '#111';
  try { katex.render(item.text, div, {displayMode: false, throwOnError: false}); }
  catch(e){ div.textContent = item.text; }
  paper.appendChild(div);
}

function drawItem(item){
  const {w, h} = dimensions();
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if(item.kind === 'stroke'){
    ctx.strokeStyle = item.color; ctx.lineWidth = item.width; ctx.beginPath();
    item.points.forEach((p, i) => { const px = p.nx * w, py = p.ny * h; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    if(item.points.length === 1) ctx.lineTo(item.points[0].nx * w + 0.1, item.points[0].ny * h + 0.1);
    ctx.stroke();
  } else if(item.kind === 'shape'){
    ctx.strokeStyle = item.color; ctx.lineWidth = item.width;
    const x1 = item.nx1 * w, y1 = item.ny1 * h, x2 = item.nx2 * w, y2 = item.ny2 * h;
    const x = Math.min(x1, x2), y = Math.min(y1, y2), sw = Math.abs(x2 - x1), sh = Math.abs(y2 - y1);
    ctx.beginPath();
    if(item.shape === 'line'){ ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }
    if(item.shape === 'rect'){ ctx.rect(x, y, sw, sh); }
    if(item.shape === 'ellipse'){ ctx.ellipse((x1+x2)/2, (y1+y2)/2, Math.max(1, sw/2), Math.max(1, sh/2), 0, 0, Math.PI*2); }
    ctx.stroke();
  } else if(item.kind === 'image' && item.src){
    let img = imageCache.get(item.src);
    if(!img){ img = new Image(); img.onload = () => render(); img.src = item.src; imageCache.set(item.src, img); }
    if(img.complete && img.naturalWidth > 0) ctx.drawImage(img, item.nx * w, item.ny * h, item.nw * w, item.nh * h);
  }
  ctx.restore();
}

function drawLaser(){
  if(!laserPoints.length) return;
  const now = Date.now();
  laserPoints = laserPoints.filter(p => now - p.t < 750);
  if(!laserPoints.length) return;
  const {w, h} = dimensions();
  ctx.save();
  for(let i = 1; i < laserPoints.length; i++){
    const p0 = laserPoints[i-1], p1 = laserPoints[i];
    const alpha = Math.max(0, 1 - (now - p1.t) / 750);
    ctx.strokeStyle = `rgba(240, 50, 50, ${alpha})`; ctx.lineWidth = 5 * alpha + 1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p0.nx * w, p0.ny * h); ctx.lineTo(p1.nx * w, p1.ny * h); ctx.stroke();
  }
  const last = laserPoints[laserPoints.length - 1];
  ctx.fillStyle = '#ff2a2a'; ctx.beginPath(); ctx.arc(last.nx * w, last.ny * h, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  requestAnimationFrame(render);
}

function normPoint(e){
  const r = canvas.getBoundingClientRect();
  return {
    nx: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)),
    ny: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))
  };
}

function setTool(t){
  if(activeInlineEditor) commitInlineText();
  tool = t;
  ['pen','laser','eraser','line','rect','ellipse','text'].forEach(k => {
    document.getElementById(k + 'Btn').classList.toggle('active', t === k);
  });
  canvas.style.cursor = t === 'text' ? 'text' : t === 'eraser' ? 'cell' : t === 'laser' ? 'pointer' : 'crosshair';
}

const getColor = () => document.getElementById('ink').value;
const getWidth = () => +document.getElementById('width').value;

let lastCursorSent = 0;
canvas.addEventListener('pointerdown', e => {
  const p = normPoint(e);
  if(tool === 'laser'){
    drawing = true; canvas.setPointerCapture(e.pointerId);
    laserPoints.push({...p, t: Date.now()});
    broadcast({type: 'laser', nx: p.nx, ny: p.ny});
    render(); return;
  }
  if(tool === 'text'){
    if(activeInlineEditor) commitInlineText();
    createInlineEditor(p.nx, p.ny);
    return;
  }

  drawing = true; canvas.setPointerCapture(e.pointerId);
  if(tool === 'pen' || tool === 'eraser'){
    current = {id: uid(), kind: 'stroke', color: tool === 'eraser' ? '#ffffff' : getColor(), width: tool === 'eraser' ? getWidth()*5 : getWidth(), points: [p]};
  } else {
    current = {id: uid(), kind: 'shape', shape: tool, color: getColor(), width: getWidth(), nx1: p.nx, ny1: p.ny, nx2: p.nx, ny2: p.ny};
  }
  broadcast({type: 'item_progress', pageIndex: page, item: current});
  render();
});

function createInlineEditor(nx, ny){
  const {w, h} = dimensions();
  const div = document.createElement('div');
  div.className = 'inline-text-editor';
  div.contentEditable = true;
  div.style.left = (nx * w) + 'px';
  div.style.top = (ny * h) + 'px';
  div.dataset.nx = nx; div.dataset.ny = ny;
  div.innerHTML = '';
  
  paper.appendChild(div);
  activeInlineEditor = div;
  div.focus();

  document.getElementById('floatingMathToolbar').style.display = 'flex';

  div.onkeydown = e => {
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
      e.preventDefault();
      commitInlineText();
    } else if(e.key === 'Escape'){
      div.remove();
      activeInlineEditor = null;
      document.getElementById('floatingMathToolbar').style.display = 'none';
    }
  };
}

function insertSnippet(snippet){
  if(!activeInlineEditor) return;
  activeInlineEditor.focus();
  document.execCommand('insertText', false, snippet);
}

function commitInlineText(){
  if(!activeInlineEditor) return;
  const text = activeInlineEditor.textContent.trim();
  const nx = parseFloat(activeInlineEditor.dataset.nx);
  const ny = parseFloat(activeInlineEditor.dataset.ny);

  if(text){
    const item = {id: uid(), kind: 'math', text, nx, ny, color: getColor()};
    pages[page].items.push(item);
    redoStack = [];
    broadcast({type: 'item_commit', pageIndex: page, item});
  }

  activeInlineEditor.remove();
  activeInlineEditor = null;
  document.getElementById('floatingMathToolbar').style.display = 'none';
  render();
}

canvas.addEventListener('pointermove', e => {
  const p = normPoint(e);
  const now = Date.now();
  if(now - lastCursorSent > 33){
    lastCursorSent = now;
    broadcast({type: 'cursor', nx: p.nx, ny: p.ny});
  }
  if(!drawing) return;
  if(tool === 'laser'){
    laserPoints.push({...p, t: now});
    broadcast({type: 'laser', nx: p.nx, ny: p.ny});
    render(); return;
  }
  if(!current) return;
  if(current.kind === 'stroke') current.points.push(p);
  else { current.nx2 = p.nx; current.ny2 = p.ny; }
  broadcast({type: 'item_progress', pageIndex: page, item: current});
  render();
});

function finishDraw(){
  if(!drawing) return;
  drawing = false;
  if(current){
    pages[page].items.push(current);
    redoStack = [];
    broadcast({type: 'item_commit', pageIndex: page, item: current});
    current = null;
  }
  renderPages(); render();
}
canvas.addEventListener('pointerup', finishDraw);
canvas.addEventListener('pointercancel', finishDraw);

function renderPages(){
  const list = document.getElementById('pageList');
  list.innerHTML = '';
  pages.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'page-thumb' + (i === page ? ' active' : '');
    b.innerHTML = `Strona ${i + 1}<small>${p.items.length} elementów</small>`;
    b.onclick = () => {
      if(activeInlineEditor) commitInlineText();
      page = i; document.getElementById('paperType').value = p.type;
      broadcast({type: 'page_switch', pageIndex: page});
      renderPages(); render();
    };
    list.appendChild(b);
  });
}

document.getElementById('penBtn').onclick = () => setTool('pen');
document.getElementById('laserBtn').onclick = () => setTool('laser');
document.getElementById('eraserBtn').onclick = () => setTool('eraser');
document.getElementById('lineBtn').onclick = () => setTool('line');
document.getElementById('rectBtn').onclick = () => setTool('rect');
document.getElementById('ellipseBtn').onclick = () => setTool('ellipse');
document.getElementById('textBtn').onclick = () => setTool('text');
document.getElementById('paperType').onchange = e => {
  pages[page].type = e.target.value;
  broadcast({type: 'paper_type', pageIndex: page, paperType: e.target.value});
  renderPages(); render();
};

document.getElementById('undoBtn').onclick = () => {
  if(activeInlineEditor) commitInlineText();
  const item = pages[page].items.pop();
  if(item){ redoStack.push(item); broadcast({type: 'full_sync', pages, page}); renderPages(); render(); }
};
document.getElementById('redoBtn').onclick = () => {
  if(activeInlineEditor) commitInlineText();
  const item = redoStack.pop();
  if(item){ pages[page].items.push(item); broadcast({type: 'full_sync', pages, page}); renderPages(); render(); }
};
document.getElementById('clearBtn').onclick = () => {
  if(activeInlineEditor) commitInlineText();
  if(confirm('Wyczyścić stronę?')){ pages[page].items = []; redoStack = []; broadcast({type: 'full_sync', pages, page}); renderPages(); render(); }
};
document.getElementById('addPage').onclick = () => {
  if(activeInlineEditor) commitInlineText();
  pages.push({id: uid(), type: document.getElementById('paperType').value, items: []});
  page = pages.length - 1; redoStack = [];
  broadcast({type: 'full_sync', pages, page}); renderPages(); render();
};
document.getElementById('duplicatePage').onclick = () => {
  if(activeInlineEditor) commitInlineText();
  const copy = JSON.parse(JSON.stringify(pages[page])); copy.id = uid();
  pages.splice(page + 1, 0, copy); page++;
  broadcast({type: 'full_sync', pages, page}); renderPages(); render();
};
document.getElementById('deletePage').onclick = () => {
  if(activeInlineEditor) commitInlineText();
  if(pages.length === 1) return;
  pages.splice(page, 1); page = Math.max(0, page - 1);
  broadcast({type: 'full_sync', pages, page}); renderPages(); render();
};

/* OBŁSUGA ZRZUTÓW EKRANU */
function handleImageFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 1100;
      let tw = img.width, th = img.height;
      if(tw > maxDim || th > maxDim){
        const r = Math.min(maxDim / tw, maxDim / th);
        tw = Math.round(tw * r); th = Math.round(th * r);
      }
      const off = document.createElement('canvas');
      off.width = tw; off.height = th;
      off.getContext('2d').drawImage(img, 0, 0, tw, th);
      const src = off.toDataURL('image/jpeg', 0.85);
      const {w, h} = dimensions();
      const fit = Math.min((w * 0.75) / tw, (h * 0.75) / th, 1);
      const item = {id: uid(), kind: 'image', src, nx: 0.05, ny: 0.05, nw: (tw * fit) / w, nh: (th * fit) / h};
      pages[page].items.push(item);
      redoStack = [];
      broadcast({type: 'item_commit', pageIndex: page, item});
      renderPages(); render();
      showToast('✓ Dodano zrzut ekranu');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

document.getElementById('imageBtn').onclick = () => document.getElementById('imageInput').click();
document.getElementById('imageInput').onchange = e => { handleImageFile(e.target.files[0]); e.target.value = ''; };

document.addEventListener('paste', e => {
  if(!document.getElementById('boardView').classList.contains('active')) return;
  if(activeInlineEditor && document.activeElement === activeInlineEditor) return;
  const cd = e.clipboardData || window.clipboardData;
  if(!cd) return;
  if(cd.files && cd.files.length > 0){
    for(const file of cd.files){ if(file.type.startsWith('image/')){ e.preventDefault(); handleImageFile(file); return; } }
  }
  if(cd.items && cd.items.length > 0){
    for(const item of cd.items){
      if(item.kind === 'file' && item.type.startsWith('image/')){
        e.preventDefault();
        const blob = item.getAsFile();
        if(blob) handleImageFile(blob);
        return;
      }
    }
  }
});

document.getElementById('pasteBtn').onclick = async () => {
  try {
    if(!navigator.clipboard || !navigator.clipboard.read){ showToast('Użyj Ctrl + V.'); return; }
    const clipboardItems = await navigator.clipboard.read();
    for(const item of clipboardItems){
      const imgType = item.types.find(t => t.startsWith('image/'));
      if(imgType){
        const blob = await item.getType(imgType);
        handleImageFile(blob);
        return;
      }
    }
    showToast('Brak obrazka w schowku.');
  } catch(err) { showToast('Kliknij na kartkę i wciśnij Ctrl + V.'); }
};

paper.addEventListener('dragover', e => { e.preventDefault(); paper.classList.add('drag-over'); });
paper.addEventListener('dragleave', () => paper.classList.remove('drag-over'));
paper.addEventListener('drop', e => {
  e.preventDefault(); paper.classList.remove('drag-over');
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0){ handleImageFile(e.dataTransfer.files[0]); }
});

document.getElementById('downloadBtn').onclick = () => {
  if(activeInlineEditor) commitInlineText();
  const a = document.createElement('a'); a.download = 'tablica.png'; a.href = canvas.toDataURL('image/png'); a.click();
};

/* P2P LIVE SYNC + AUTOMATYCZNA SYNCHRONIZACJA WSZYSTKICH TABLIC */
let peer = null, connections = [];
const remoteCursorEl = document.getElementById('remoteCursor');

function initLivePeer(boardId){
  if(peer) peer.destroy();
  connections = [];
  const peerId = 'matplus-board-' + boardId.toLowerCase();
  
  peer = new Peer(peerId);
  peer.on('open', () => { setLiveStatus('online', 'LIVE (Gotowy)'); });
  peer.on('error', () => {
    peer = new Peer();
    peer.on('open', () => { setupConnection(peer.connect(peerId, {reliable: true})); });
  });
  peer.on('connection', conn => setupConnection(conn));
}

function setLiveStatus(state, text){
  document.getElementById('liveDot').className = 'dot ' + (state === 'online' ? 'online' : 'waiting');
  document.getElementById('liveText').textContent = text;
}

function broadcast(msg){
  connections.forEach(c => { if(c && c.open) try{ c.send(msg); }catch(e){} });
}

function setupConnection(conn){
  connections.push(conn);
  conn.on('open', () => {
    setLiveStatus('online', 'LIVE (Połączono)');
    const currentBoard = getStoredBoards().find(b => b.id === activeBoardId);
    
    // 1. Synchronizacja aktywnej tablicy na żywo
    conn.send({
      type: 'full_sync',
      pages,
      page,
      boardMeta: currentBoard ? { id: currentBoard.id, title: currentBoard.title, folder: currentBoard.folder, date: currentBoard.date } : null
    });

    // 2. KLUCZOWE: Automatyczne przesłanie WSZYSTKICH Twoich tablic i folderów do ucznia
    conn.send({
      type: 'sync_all_boards',
      allBoards: getStoredBoards()
    });
  });

  conn.on('data', msg => {
    if(!msg || !msg.type) return;
    if(msg.type === 'cursor'){
      const {w, h} = dimensions();
      remoteCursorEl.style.display = 'block';
      remoteCursorEl.style.left = (msg.nx * w) + 'px';
      remoteCursorEl.style.top = (msg.ny * h) + 'px';
    } else if(msg.type === 'laser'){
      laserPoints.push({nx: msg.nx, ny: msg.ny, t: Date.now()}); render();
    } else if(msg.type === 'item_progress'){
      if(msg.pageIndex === page){ remoteActiveItem = msg.item; render(); }
    } else if(msg.type === 'item_commit'){
      remoteActiveItem = null;
      if(pages[msg.pageIndex] && !pages[msg.pageIndex].items.some(x => x.id === msg.item.id)){
        pages[msg.pageIndex].items.push(msg.item);
      }
      renderPages(); render();
    } else if(msg.type === 'page_switch'){
      if(pages[msg.pageIndex]){ page = msg.pageIndex; document.getElementById('paperType').value = pages[page].type; renderPages(); render(); }
    } else if(msg.type === 'paper_type'){
      if(pages[msg.pageIndex]){ pages[msg.pageIndex].type = msg.paperType; if(msg.pageIndex === page) document.getElementById('paperType').value = msg.paperType; renderPages(); render(); }
    } else if(msg.type === 'sync_all_boards'){
      // Otrzymanie pełnej listy tablic od nauczyciela (działa po stronie ucznia)
      if(msg.allBoards && Array.isArray(msg.allBoards)){
        const localBoards = getStoredBoards();
        const merged = [...localBoards];
        msg.allBoards.forEach(b => {
          const existingIdx = merged.findIndex(x => x.id === b.id);
          if(existingIdx !== -1){
            merged[existingIdx] = b;
          } else {
            merged.push(b);
          }
        });
        saveStoredBoards(merged);
        if(document.getElementById('dashboardView').classList.contains('active')){
          renderDashboard();
        }
      }
    } else if(msg.type === 'full_sync'){
      if(msg.pages && msg.pages.length > 0){
        pages = msg.pages; 
        page = Math.min(msg.page || 0, pages.length - 1);
        document.getElementById('paperType').value = pages[page].type;
      }
      if(msg.boardMeta){
        document.getElementById('currentBoardTitleHeader').textContent = msg.boardMeta.title;
        document.getElementById('currentBoardFolderBadge').textContent = '📁 ' + getFolderName(msg.boardMeta.folder);
        const boards = getStoredBoards();
        const idx = boards.findIndex(b => b.id === msg.boardMeta.id);
        if(idx !== -1){
          boards[idx].title = msg.boardMeta.title;
          boards[idx].folder = msg.boardMeta.folder;
          boards[idx].pages = pages;
          boards[idx].currentPage = page;
          saveStoredBoards(boards);
        }
      }
      renderPages(); render();
    }
  });

  conn.on('close', () => {
    remoteCursorEl.style.display = 'none';
    setLiveStatus('waiting', 'Oczekiwanie...');
  });
}

window.addEventListener('resize', resizeCanvas);

window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const boardParam = urlParams.get('board');
  const roleParam = urlParams.get('role');

  if(roleParam === 'student'){
    isStudentMode = true;
  }

  applyRoleUI();

  if(boardParam){
    openBoard(boardParam, {
      title: urlParams.get('title'),
      folder: urlParams.get('folder')
    });
  }
});
